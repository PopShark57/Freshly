name: Freshly
options:
  bundleIdPrefix: com.freshly
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Freshly:
    type: application
    platform: macOS
    sources:
      - Freshly
    info:
      path: Freshly/Info.plist
      properties:
        CFBundleDisplayName: Freshly
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Keeping your Mac fresh."
    entitlements:
      path: Freshly/Freshly.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freshly.Freshly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: NO
  FreshlyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FreshlyTests
    dependencies:
      - target: Freshly
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Freshly.app/Contents/MacOS/Freshly"
schemes:
  Freshly:
    build:
      targets:
        Freshly: all
        FreshlyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FreshlyTests
